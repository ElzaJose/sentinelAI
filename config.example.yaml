# ================================================================
# SentinelAI Configuration — EXAMPLE
# Copy this file to config.yaml and fill in your values.
# NEVER commit config.yaml (it contains your API key).
# ================================================================

llm:
  # ---- Gemini (free tier) — recommended ----
  # Get a free key at https://aistudio.google.com/apikey
  model: gemini-2.0-flash
  api_key: ${GEMINI_API_KEY}           # set env var, or paste key in config.yaml
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  temperature: 0.2

  # ---- OpenAI (paid) ----
  # model: gpt-4o-mini
  # api_key: ${OPENAI_API_KEY}
  # base_url: https://api.openai.com/v1

  # ---- Ollama (free, local, no internet needed) ----
  # model: llama3
  # api_key: ollama
  # base_url: http://localhost:11434/v1

app:
  # Describe your application — helps the LLM give more relevant analysis.
  name: "My Application"
  description: ""
  # Example: "Django REST API backed by PostgreSQL, deployed on AWS ECS"

safety:
  # auto_execute: true  → run shell commands automatically (use with care)
  # auto_execute: false → suggest commands but require manual execution (default)
  auto_execute: false

  # Commands allowed to run automatically even when auto_execute is false.
  # Add prefixes you trust (e.g. "docker restart", "pm2 restart").
  allowed_shell_commands: []

  command_timeout_seconds: 30
  max_retries: 3

adapters:
  log_watcher:
    enabled: false
    log_path: ""          # Absolute path to your app log file

  http:
    enabled: false
    host: "0.0.0.0"
    port: 8080
